<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <style> 
      body {
       font-family: 'Google Sans', sans-serif;    
       padding: 24px;
       background-color: gray;
       color: black;
       font-size: 20px;
       max-width: 700px;
      }
      header {
       text-allign: center;
      }
      section {
       background-color: white;
       padding: 16px 24px;
       margin-bottom: 16px;
       border-radius: 12px;
      }
      h1 {
       color: #123456;
      }
      .btn {
       background-color: #2FB57A;
       color: white;
       padding: 15px 20px; 
       border-radius: 90px;
       text-decoration: none;
       cursor: pointer;
      }
      .btn:hover {
       background-color: #333333;
     }
      body.dark {
       background-color: #1E1E2E;
       color: #F0F0F0;
     }
      body.dark.h1 {
        color: #64C466;
      }
      body.dark.section {

     }
    </style>
    <title>CV ของฉัน</title>
  </head>
  <body>

      <img src="dice.jpg" alt="รูปของฉัน" width="120">

      </p>
    </header>
  
    <section> 
      <h2>
        Currently in MWIT.
      </h2> 
    </section>
  
    <section> 
      <h2>
        Things I like:
        <ul>
          <li>Math</li>

        </ul>
      </h2>
    </section>
    
    <footer>
      <a class="btn" href="https://github.com/techinchawa36">Github</a>

        document.body.classList.toggle("dark");
      }
    </script>
  </body>
</html>
